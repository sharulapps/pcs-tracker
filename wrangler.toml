name = "pcs-tracker"
main = "worker/index.js"
compatibility_date = "2026-09-01"
# Keep variables added in the Cloudflare dashboard when deploying from GitHub.
keep_vars = true

# Serves public/index.html; /api/* falls through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
# Used when the main model is busy or over quota. "" turns it off.
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
ALLOWED_ORIGIN = "*"

# Secrets (do not put these in this file):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put FIREBASE_PROJECT_ID
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL
#   npx wrangler secret put FIREBASE_PRIVATE_KEY
#   npx wrangler secret put APP_TOKEN        (optional)
